name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/director-tax-savings-app-mrg0cd
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # The Google Drive client ID used to come from a committed .env file.
      # It now comes from a repository variable, and the build stops if it's
      # missing so a deploy can never ship with Drive sync silently off.
      - name: Check Google client ID is set
        run: |
          if [ -z "$VITE_GOOGLE_CLIENT_ID" ]; then
            echo "::error::Add the VITE_GOOGLE_CLIENT_ID repository variable (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
